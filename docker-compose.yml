version: '3.9'

services:
  # ─── Backend API ────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: translator-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      GOOGLE_TRANSLATE_API_KEY: ${GOOGLE_TRANSLATE_API_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      ADMIN_REGISTRATION_SECRET: ${ADMIN_REGISTRATION_SECRET}
    ports:
      - "5000:5000"
    networks:
      - translator-net
    depends_on:
      - mongo
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Security: drop all Linux capabilities, read-only root FS
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  # ─── Frontend ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: translator-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - translator-net
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true

  # ─── MongoDB ─────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: translator-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS}
      MONGO_INITDB_DATABASE: live_translator
    volumes:
      - mongo-data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - translator-net
    # Do NOT expose port 27017 externally in production
    # ports:
    #   - "27017:27017"
    security_opt:
      - no-new-privileges:true
    command: mongod --auth --bind_ip_all

networks:
  translator-net:
    driver: bridge

volumes:
  mongo-data:
    driver: local
